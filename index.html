<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile & Music Player</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div id="intro-screen" class="intro-screen">
    <button id="enter-btn">اضغط للدخول</button>
  </div>

  <div class="main-container">
    
    <div class="discord-box">
      <img id="discord-avatar" src="" alt="Avatar">
      <div>
        <div id="discord-username">Loading...</div>
        <div id="discord-status-text">OFFLINE</div>
        <div id="discord-device">Offline</div>
        <div id="discord-activity">No activities right now.</div>
      </div>
      <span id="discord-status-dot" class="status-indicator offline"></span>
    </div>

    <div class="music-player">
      <audio id="audio-player" preload="auto"></audio>
      
      <div class="disc-container">
        <div id="disc" class="disc">
          <div id="disc-track-name">Runaway</div>
          <div id="disc-artist-name">AURORA</div>
        </div>
      </div>

      <div class="track-info">
        <span id="current-track-title">Runaway</span>
        <span id="track-counter">1/4</span>
      </div>

      <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.1">
      
      <div class="time-container">
        <span id="current-time">0:00</span>
        <span id="duration-time">0:00</span>
      </div>

      <div class="controls">
        <button id="prev-btn"><i class="fas fa-backward"></i></button>
        <button id="play-pause-btn"><i class="fas fa-play"></i></button>
        <button id="next-btn"><i class="fas fa-forward"></i></button>
      </div>

      <div class="volume-container">
        <i class="fas fa-volume-up"></i>
        <input type="range" id="volume-bar" value="80" min="0" max="100">
      </div>

      <div class="playlist-container"></div>

    </div>

    <div class="footer-box">
      <div>الزيارات: <span id="visitor-count">1042</span></div>
      <button id="back-to-top">العودة للأعلى</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
