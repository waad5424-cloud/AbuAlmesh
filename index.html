<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>world silentreaper</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- شاشة الدخول -->
  <div id="intro-screen">
    <div class="intro-content">
      <h1 class="intro-title">world silentreaper</h1>
      <i class="fas fa-play-circle intro-icon"></i>
      <h2>اضغط في أي مكان للدخول</h2>
    </div>
  </div>

  <!-- المحتوى الرئيسي -->
  <div id="main-content" class="hidden">
    <div class="stars-bg"></div>

    <div class="container">

      <!-- العنوان الرئيسي للموقع -->
      <header class="main-header">
        <h1 class="site-title">world silentreaper</h1>
      </header>

      <!-- كرت 1: بطاقة الموسيقى النيون -->
      <div class="card album-cover-card">
        <div class="cover-box" id="disc">
          <i class="fas fa-music cover-icon"></i>
        </div>
        <h3 class="disc-title">Thank You</h3>
        <span class="disc-artist">Dido (Slowed/Reverb)</span>

        <div class="audio-controls">
          <audio id="audio-player" src="song.mp3" loop></audio>
          
          <div class="time-slider">
            <span id="current-time">0:00</span>
            <input type="range" id="progress-bar" value="0" min="0" max="100">
            <span id="duration-time">0:00</span>
          </div>

          <div class="control-buttons">
            <button id="play-pause-btn" class="btn-control"><i class="fas fa-play"></i></button>
            <div class="volume-container">
              <i class="fas fa-volume-up"></i>
              <input type="range" id="volume-bar" value="100" min="0" max="100">
            </div>
          </div>
        </div>
      </div>

      <!-- كرت 2: حالة ديسكورد -->
      <div class="card discord-card">
        <div class="discord-header">
          <div class="avatar-wrapper">
            <img class="discord-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Discord Avatar">
            <span class="status-indicator offline"></span>
          </div>
          <div class="discord-user-header">
            <h3>جاري التحميل...</h3>
            <span class="discord-activity">جاري جلب الحالة...</span>
          </div>
        </div>
      </div>

      <!-- كرت 3: معلومات عني -->
      <div class="card about-card">
        <h3 class="section-title"><i class="fas fa-user"></i> معلومات عني</h3>
        <p class="about-text">مرحباً بك في عالمي الشخصي!</p>
      </div>

      <!-- كرت 4: روابط التواصل Find Me -->
      <div class="card links-card">
        <h3 class="section-title"><i class="fas fa-link"></i> Find Me</h3>
        <div class="social-links">
          <a href="https://discord.com" target="_blank" class="social-btn"><i class="fab fa-discord"></i> Discord</a>
          <a href="https://github.com" target="_blank" class="social-btn"><i class="fab fa-github"></i> GitHub</a>
          <a href="https://instagram.com" target="_blank" class="social-btn"><i class="fab fa-instagram"></i> Instagram</a>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
