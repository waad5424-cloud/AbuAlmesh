<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I4.J | Bio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- شاشة الدخول -->
  <div id="intro-screen">
    <div class="intro-content">
      <p>إضغط للدخول</p>
    </div>
  </div>

  <!-- المحتوى الرئيسي -->
  <div id="main-content" class="hidden">
    <!-- خلفية الفيديو / الصورة -->
    <div class="background-overlay"></div>

    <div class="container">

      <!-- مشغل الصوت -->
      <div class="music-player">
        <div class="song-info">
          <span class="song-title">Dido - Thank You (Slowed / Reverb)</span>
        </div>
        <div class="disc-container">
          <div id="disc" class="disc"></div>
        </div>
        <div class="player-controls">
          <button id="play-pause-btn"><i class="fas fa-play"></i></button>
          <div class="progress-container">
            <input type="range" id="progress-bar" value="0" min="0" max="100">
            <div class="time-display">
              <span id="current-time">0:00</span> / <span id="duration-time">0:00</span>
            </div>
          </div>
          <div class="volume-container">
            <i class="fas fa-volume-up"></i>
            <input type="range" id="volume-bar" value="50" min="0" max="100">
          </div>
        </div>
        <!-- ملف الأغنية -->
        <audio id="audio-player" src="music.mp3"></audio>
      </div>

      <!-- كروت التواصل الاجتماعي (Socials) -->
      <div class="socials-grid">
        
        <!-- كرت الديسكورد المباشر -->
        <a href="https://discord.com/users/1159623336041652244" target="_blank" class="social-card">
          <div class="social-icon"><i class="fab fa-discord"></i></div>
          <h3>Discord</h3>
          <span>I4.J</span>
        </a>

      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
