<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>doou store</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- شاشة الدخول الاحترافية -->
  <div id="intro-screen">
    <div class="intro-content">
      <i class="fas fa-play-circle intro-icon"></i>
      <h2>اضغط في أي مكان للدخول</h2>
    </div>
  </div>

  <!-- المحتوى الرئيسي للموقع -->
  <div id="main-content" class="hidden">
    <div class="stars-bg"></div>

    <div class="container">
      
      <!-- كرت بطاقة الموسيقى النيون -->
      <div class="card album-cover-card">
        <div class="cover-box" id="disc">
          <i class="fas fa-music cover-icon"></i>
        </div>
        <h3 class="disc-title">Thank You</h3>
        <span class="disc-artist">Dido (Slowed/Reverb)</span>

        <!-- مشغل الصوت والتحكم -->
        <div class="audio-controls">
          <audio id="audio-player" src="song.mp3" loop></audio>
          
          <div class="time-slider">
            <span id="current-time">0:00</span>
            <input type="range" id="progress-bar" value="0" min="0" max="100">
            <span id="duration-time">0:00</span>
          </div>

          <div class="control-buttons">
            <button id="play-pause-btn" class="btn-control"><i class="fas fa-play"></i></button>
            <div class="volume-container">
              <i class="fas fa-volume-up"></i>
              <input type="range" id="volume-bar" value="100" min="0" max="100">
            </div>
          </div>
        </div>
      </div>

      <!-- كرت حالة ديسكورد M4.J -->
      <div class="card discord-card">
        <div class="discord-header">
          <div class="avatar-wrapper">
            <img class="discord-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Discord Avatar">
            <span class="status-indicator offline"></span>
          </div>
          <div class="discord-user-header">
            <h3>جاري التحميل...</h3>
            <span class="discord-activity">جاري جلب الحالة...</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
