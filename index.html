<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arther's Profile</title>
  <!-- مكتبة الأيقونات FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* --- التنسيقات العامة والخطوط --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Tajawal', sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background-image: url('https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExNDVrMmpwbmprNGFoemZzOXp4NW9teXR6MDI4cmJkaHNld3hseGxvaCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/ZhHH49UVo7CIo/giphy.gif');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      filter: grayscale(100%) contrast(140%) brightness(100%);
    }

    .bg-overlay {
      background: rgba(0, 0, 0, 0.7);
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    /* --- تصميم الـ Navbar العلوي الفخم --- */
    .site-header {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 900px;
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 40px;
      padding: 10px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 999;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .nav-brand {
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: #fff;
    }

    .nav-links {
      display: flex;
      gap: 14px;
    }

    .nav-link {
      text-decoration: none;
      color: #aaa;
      font-size: 0.75rem;
      font-weight: 600;
      transition: color 0.2s;
    }

    .nav-link:hover, .nav-link.active {
      color: #ffffff;
    }

    .nav-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .nav-icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ccc;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .nav-icon-btn:hover {
      border-color: #ffffff;
      color: #ffffff;
    }

    @media(max-width: 900px) {
      .nav-links {
        display: none;
      }
    }

    /* --- شاشة الدخول --- */
    #intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100000;
      transition: opacity 0.6s ease;
    }

    #intro-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .intro-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      text-align: center;
    }

    .intro-top-badge {
      font-size: 0.75rem;
      letter-spacing: 3px;
      color: #888;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 18px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.02);
    }

    .enter-btn {
      background: rgba(20, 20, 20, 0.8);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 14px 35px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.9), inset 0 0 10px rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }

    .enter-btn:hover {
      background: rgba(40, 40, 40, 0.9);
      border-color: #ffffff;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.2);
      transform: scale(1.03);
    }

    .intro-hints {
      display: flex;
      gap: 15px;
      font-size: 0.65rem;
      color: #555;
      letter-spacing: 1.5px;
      font-weight: 600;
    }

    .page-container {
      width: 100%;
      max-width: 650px;
      padding: 100px 20px 40px 20px;
      display: flex;
      flex-direction: column;
      gap: 35px;
      z-index: 2;
    }

    .section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* --- قسم الـ Hero --- */
    .hero-section {
      padding: 40px 0;
      text-align: left;
      align-items: flex-start;
      width: 100%;
    }

    .hero-subtitle {
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: #888;
      font-weight: 700;
      margin-bottom: 5px;
      display: block;
    }

    .hero-title {
      font-size: 3rem;
      font-weight: 900;
      color: #fff;
      margin-bottom: 10px;
    }

    .hero-desc {
      color: #aaa;
      font-size: 0.95rem;
    }

    .about-content, .skills-grid, .projects-card {
      width: 100%;
    }

    .about-content {
      background: rgba(15, 15, 15, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(10px);
    }

    .about-description {
      color: #ddd;
      font-size: 1rem;
      line-height: 1.6;
    }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .skill-card {
      background: rgba(15, 15, 15, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 15px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #ddd;
    }

    .skill-card i {
      color: #ffffff;
      font-size: 1.2rem;
    }

    .projects-card {
      background: rgba(15, 15, 15, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 20px;
      border-radius: 16px;
    }

    .music-player-wrapper {
      width: 100%;
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 15px;
      background: rgba(15, 15, 15, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(12px);
      align-items: center;
    }

    @media(max-width: 600px) {
      .music-player-wrapper {
        grid-template-columns: 1fr;
      }
    }

    .player-left-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }

    .now-playing-header {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .badge-mini {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 6px;
      width: fit-content;
      font-weight: 700;
    }

    .np-label {
      font-size: 0.7rem;
      color: #888;
      letter-spacing: 0.5px;
    }

    .track-title-main {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }

    .progress-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    input[type="range"] {
      accent-color: #ffffff;
      cursor: pointer;
      width: 100%;
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: #888;
    }

    .controls-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    .ctrl-btn {
      background: transparent;
      border: none;
      color: #aaa;
      font-size: 1rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .ctrl-btn:hover {
      color: #ffffff;
    }

    .play-btn-purple {
      background: #ffffff;
      color: #000;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
      transition: transform 0.2s, background 0.2s;
    }

    .play-btn-purple:hover {
      transform: scale(1.08);
      background: #e0e0e0;
    }

    .volume-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #aaa;
    }

    .loop-badge {
      font-size: 0.7rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .playlist-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(0, 0, 0, 0.4);
      padding: 8px;
      border-radius: 10px;
    }

    .playlist-label {
      font-size: 0.65rem;
      color: #777;
      font-weight: bold;
    }

    .playlist-item {
      display: flex;
      flex-direction: column;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .playlist-item span {
      font-size: 0.8rem;
      color: #ccc;
      font-weight: 600;
    }

    .playlist-item small {
      font-size: 0.65rem;
      color: #777;
    }

    .playlist-item.active {
      background: rgba(255, 255, 255, 0.15);
      border-left: 3px solid #ffffff;
    }

    .playlist-item.active span {
      color: #ffffff;
    }

    .player-right-disc {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .vinyl-record {
      width: 120px;
      height: 120px;
      background: #111;
      border: 4px solid #444;
      border-radius: 50%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
    }

    .vinyl-record.playing {
      animation: spin 4s linear infinite;
      border-color: #ffffff;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .vinyl-center {
      width: 40px;
      height: 40px;
      background: #ffffff;
      border-radius: 50%;
      border: 3px solid #000;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
    }

    .disc-track-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
      text-align: center;
    }

    .disc-artist-name {
      font-size: 0.75rem;
      color: #888;
      text-align: center;
    }

    .discord-wide-card {
      width: 100%;
      background: rgba(15, 15, 15, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 18px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(10px);
    }

    .dc-user-info {
      display: flex;
      align-items: center;
      gap: 15px;
      text-align: left;
    }

    .dc-avatar-container {
      position: relative;
      width: 60px;
      height: 60px;
    }

    .discord-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.4);
    }

    .status-indicator {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #0f0f0f;
    }

    .status-indicator.online { background: #3ba55d; }
    .status-indicator.idle { background: #faa81a; }
    .status-indicator.dnd { background: #ed4245; }
    .status-indicator.offline { background: #747f8d; }

    .dc-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .dc-name-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dc-username {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
    }

    .dc-badge {
      font-size: 0.65rem;
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .dc-device {
      font-size: 0.75rem;
      color: #888;
    }

    .dc-activity {
      font-size: 0.8rem;
      color: #cccccc;
      margin-top: 2px;
    }

    .dc-arrow {
      color: #666;
      font-size: 1rem;
    }

    /* --- Socials Grid & doou store --- */
    .socials-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    @media(max-width: 600px) {
      .socials-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .social-card {
      background: rgba(15, 15, 15, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      backdrop-filter: blur(10px);
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .social-card:hover {
      transform: translateY(-3px);
      border-color: #ffffff;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
    }

    .social-icon-wrapper {
      font-size: 1.5rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
    }

    .social-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
    }

    .social-handle {
      font-size: 0.75rem;
      color: #888;
    }

    /* --- Visitors Card Styling --- */
    .visitors-card {
      width: 100%;
      background: rgba(15, 15, 15, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .visitor-icon-box {
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-size: 1.2rem;
      box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.1);
    }

    .visitor-label {
      cursor: default;
      font-size: 0.7rem;
      letter-spacing: 2px;
      color: #888;
      font-weight: 700;
    }

    .visitor-number {
      font-size: 2.2rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: 1px;
    }

    .visitor-status-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 5px;
    }

    .v-dot {
      width: 8px;
      height: 8px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px #ffffff;
    }

    .v-status-text {
      font-size: 0.75rem;
      color: #aaa;
    }

    /* --- تأثير ضوء الماوس الأبيض الخفيف --- */
    .mouse-glow {
      position: fixed;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 40%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 9999;
      mix-blend-mode: screen;
    }

    /* --- تأثير تساقط أوراق الشجر --- */
    .leaves-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    .leaf {
      position: absolute;
      top: -10vh;
      width: 16px;
      height: 12px;
      background: rgba(255, 255, 255, 0.35);
      border-radius: 0% 80% 20% 80%;
      animation: fall linear infinite;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.2);
    }

    @keyframes fall {
      0% {
        transform: translateY(-10vh) translateX(0) rotate(0deg);
        opacity: 0.8;
      }
      50% {
        transform: translateY(50vh) translateX(40px) rotate(180deg);
        opacity: 0.5;
      }
      100% {
        transform: translateY(110vh) translateX(-30px) rotate(360deg);
        opacity: 0;
      }
    }

    .leaf:nth-child(1) { left: 10%; animation-duration: 9s; animation-delay: 0s; }
    .leaf:nth-child(2) { left: 25%; animation-duration: 12s; animation-delay: 2s; }
    .leaf:nth-child(3) { left: 40%; animation-duration: 8s; animation-delay: 4s; }
    .leaf:nth-child(4) { left: 55%; animation-duration: 11s; animation-delay: 1s; }
    .leaf:nth-child(5) { left: 70%; animation-duration: 10s; animation-delay: 3s; }
    .leaf:nth-child(6) { left: 85%; animation-duration: 13s; animation-delay: 5s; }
  </style>
</head>
<body>

  <!-- طبقة التغميق للخلفية -->
  <div class="bg-overlay"></div>

  <!-- تأثير ضوء الماوس -->
  <div class="mouse-glow" id="mouseGlow"></div>

  <!-- تأثير أوراق الشجر المتساقطة -->
  <div class="leaves-container">
      <div class="leaf"></div>
      <div class="leaf"></div>
      <div class="leaf"></div>
      <div class="leaf"></div>
      <div class="leaf"></div>
      <div class="leaf"></div>
  </div>

  <!-- محتوى الصفحة -->
  <header class="site-header">
    <div class="nav-brand">ARTHER</div>
    <nav class="nav-links">
      <a href="#" class="nav-link active">Home</a>
      <a href="#" class="nav-link">About</a>
      <a href="#" class="nav-link">Projects</a>
    </nav>
    <div class="nav-actions">
      <button class="nav-icon-btn"><i class="fa-solid fa-volume-high"></i> Sound</button>
    </div>
  </header>

  <main class="page-container">
    <section class="hero-section">
      <span class="hero-subtitle">WELCOME TO MY PROFILE</span>
      <h1 class="hero-title">Arther</h1>
      <p class="hero-desc">Developer & Creator building awesome digital experiences.</p>
    </section>
  </main>

  <!-- سكربت حركة ضوء الماوس -->
  <script>
    const mouseGlow = document.getElementById('mouseGlow');
    window.addEventListener('mousemove', (e) => {
      mouseGlow.style.left = e.clientX + 'px';
      mouseGlow.style.top = e.clientY + 'px';
    });
  </script>

</body>
</html>
